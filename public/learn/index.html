      <p>The distilled per-concept revision sheet from the build sessions. Each concept gives the <strong>core idea</strong>, a short <strong>one-liner</strong>, and where useful the <strong>quiz Q&amp;A</strong> that pins it down.</p>

      <h3>Phase 1 &mdash; Domain types (TypeScript)</h3>
      <p><strong>Discriminated unions.</strong> A union of object types that all share one field (<code>kind</code>) with a unique literal value per variant. Checking that field narrows the whole type.</p>
      <p><em>One-liner:</em> "A regular union says 'one of these types'; a discriminated union adds a shared literal <code>kind</code> so TypeScript can narrow to the exact variant in a switch."</p>
      <p><strong>never and exhaustiveness.</strong> <code>never</code> is the bottom type, a value that can never exist. Put <code>assertNever(x: never)</code> in a switch <code>default</code>; once all variants are handled TS narrows the value to <code>never</code> there and accepts it. Add a variant without a case and it errors.</p>
      <pre><code>function assertNever(x: never): never {
  throw new Error(\`Unhandled variant: \${JSON.stringify(x)}\`)
}</code></pre>
      <p><em>One-liner:</em> "The <code>never</code> default branch turns 'I forgot a case' into a compile error."</p>
      <p><strong>Structural typing &amp; branded types.</strong> TS compares types by shape, not name. <code>type NodeId = string</code> is transparent, any string satisfies it. A brand adds a phantom property that exists only at the type level:</p>
      <pre><code>type NodeId = string & { readonly __brand: 'NodeId' }</code></pre>
      <p><em>One-liner:</em> "Branding adds a compile-only phantom field so <code>NodeId</code> and <code>EdgeId</code> stop being interchangeable strings."</p>
      <p><strong>Cast helper functions.</strong> <code>as NodeId</code> bypasses the type system. Centralise it in one function (<code>nodeId(raw)</code>) so the unsafe cast lives in one auditable place and can gain runtime validation later.</p>

      <h3>Phase 2 &mdash; Sample data (TypeScript + algorithms)</h3>
      <p><strong>as const.</strong> Without it, <code>['supports','contradicts','derives']</code> infers as <code>string[]</code>, which will not satisfy a string-literal union. <code>as const</code> locks it to the readonly literal tuple, so indexing yields a literal type.</p>
      <p><em>One-liner:</em> "<code>as const</code> freezes an array to literal types so its values can match a string-literal union."</p>
      <p><strong>Seeded PRNG (mulberry32).</strong> Takes an integer seed, returns a closure producing deterministic floats in [0,1). Same seed gives the same sequence gives reproducible graphs.</p>
      <p><em>One-liner:</em> "A seeded PRNG makes the random graph deterministic, so tests and renders are reproducible."</p>
      <p><strong>Graph data vs. layout</strong> (the principle that drives later refactors). The domain model is pure data: ids, fields, connections. Where things appear on screen is the renderer's job. Do not mix layout into the data model.</p>
      <p><em>One-liner:</em> "Data is what the graph <em>is</em>; layout is where the renderer <em>puts</em> it, keep them apart."</p>
      <p><strong>Building connected data.</strong> When creating relation nodes/edges, reference <code>.id</code> off already-created items rather than hand-building id strings, the type stays correct (<code>NodeId</code>) and there is nothing to typo.</p>

      <h3>Phase 3 &mdash; Pinia store</h3>
      <p><strong>ref vs shallowRef.</strong> <code>ref</code> deep-tracks (proxies every nested object); <code>shallowRef</code> only tracks reassignment of <code>.value</code>. Use <code>shallowRef</code> for the big <code>nodes</code>/<code>edges</code> arrays because the update pattern is always whole-array replacement, never in-place mutation.</p>
      <p><em>One-liner:</em> "<code>shallowRef</code> tracks only <code>.value</code> reassignment, which is exactly my update pattern, so I skip the cost of proxying 100k node objects."</p>
      <p><em>Q: plain <code>ref</code> vs <code>shallowRef</code> when you mutate a node in place?</em> With <code>ref</code> the DOM updates (deep tracking fires). With <code>shallowRef</code> the data changes but no reactivity fires, a stale view over correct data. That is the accepted trade-off, safe because the code never mutates in place.</p>
      <p><strong>computed vs manual ref (selectedNode).</strong> <code>selectedNode</code> is a computed deriving from <code>selectedNodeId</code> AND <code>nodes</code>. A manual ref would be a cache you must re-sync at every mutation site, the killer is <code>regenerate</code>, which swaps the whole array and would leave a stale node reference.</p>
      <p><em>One-liner:</em> "<code>computed</code> is the single source of truth for derived state; a manual ref is a cache you are obligated to invalidate and will eventually forget."</p>
      <p><strong>storeToRefs.</strong> Destructuring a store copies the property's current value into a dead variable. <code>storeToRefs</code> wraps each state/getter in a live <code>ref</code>. Actions are destructured straight off the store, functions need no wrapper.</p>
      <p><em>One-liner:</em> "Plain destructure = dead copy; <code>storeToRefs</code> = live ref wrapper. Wrap state/getters, call actions off the store."</p>
      <p><strong>Setup-store mapping &amp; privacy.</strong> <code>ref</code>/<code>shallowRef</code> gives state, <code>computed</code> gives getter, <code>function</code> gives action. How it is <em>declared</em> decides the category. Anything you do not <code>return</code> is private (e.g. <code>seed</code>).</p>
      <p><em>One-liner:</em> "In a setup store, what you do not return is private state; in TS strict, calling an unreturned member is a compile error, not a runtime crash."</p>
      <p><strong>Action single-responsibility (the setMode refactor).</strong> Original <code>setMode</code> set the mode AND regenerated the graph AND hardcoded counts, three jobs, and it violated data/layout separation. Fixed: <code>setMode</code> only sets <code>mode</code>. Count is a separate <code>regenerate(count)</code>; re-placing nodes on mode change is the renderer's job; "disc usually wants more nodes" is UI policy for <code>GraphControls</code>.</p>
      <p><em>One-liner:</em> "A store action should do one thing and not encode UI policy."</p>

      <h3>Phase 4 &mdash; Vue component shell</h3>
      <p><strong>&lt;script setup&gt;.</strong> No <code>export default</code>, no <code>return</code>. Every top-level binding (including imported components) is auto-exposed to the template, so no <code>components: {}</code> registration. In a template you write <code>count</code>, not <code>count.value</code>, refs auto-unwrap.</p>
      <p><strong>Attribute binding, :class object syntax.</strong> No colon = literal string (<code>type="button"</code>). Colon = JS expression (<code>:key="count"</code>). <code>:class="{ active: cond }"</code> applies the class only while <code>cond</code> is truthy.</p>
      <p><strong>v-for and :key.</strong> <code>:key</code> gives each item a stable identity. <em>What breaks without it?</em> It still renders; Vue falls back to index-based patching. The bug shows when items carry local state and the list reorders, that state binds to the wrong row.</p>
      <p><strong>v-if vs v-show.</strong> <code>v-if</code> adds/removes the element from the DOM (runs lifecycle). <code>v-show</code> always renders and toggles CSS <code>display:none</code>. <code>&lt;template v-if&gt;</code> groups elements with no wrapper DOM node.</p>
      <p><strong>Discriminated-union narrowing in the template</strong> (the Phase 1 payoff). Inside <code>v-if="selectedNode.kind === 'concept'"</code>, TS narrows <code>selectedNode</code> to the concept variant, so <code>.weight</code>/<code>.label</code> are safe. Move <code>{{ selectedNode.weight }}</code> outside that block and TS errors, on the full union <code>.weight</code> is not on every member.</p>
      <p><strong>Composable vs utility (useFps).</strong> A composable holds reactive state and/or registers lifecycle hooks; it must be called in setup. A utility is pure input to output. In <code>useFps</code>, only <code>fps</code> is a ref (the UI reads it); <code>frames</code>/<code>lastSample</code> are plain closure vars. Reactive only what the view consumes.</p>
      <p><strong>defineProps / defineEmits.</strong> Compiler macros (no import), only legal at the top level of <code>&lt;script setup&gt;</code>. Type-only generic form is the TS idiom. Props are read-only.</p>
      <p><strong>Data down, events up.</strong> Props flow parent to child (read-only). To change parent/store state, a child <code>emit</code>s an event and the parent (owner of the store) calls the action.</p>
      <p><strong>Smart vs dumb components.</strong> Read the store directly when the component is app-specific (<code>GraphControls</code>, <code>NodeInspector</code>, <code>GraphCanvas</code>). Take props when it is generic/reusable (<code>StatsOverlay</code>). Decision rule: "could this be reused in a different app? If yes, props."</p>
      <p><strong>Template refs.</strong> <code>&lt;canvas ref="canvasEl"&gt;</code> + <code>const canvasEl = ref&lt;HTMLCanvasElement | null&gt;(null)</code>. The var name must match the <code>ref="..."</code> string. It is <code>null</code> during setup; Vue assigns the real element at mount (use it in <code>onMounted</code>). The <code>| null</code> forces a strict-null guard before WebGL use.</p>

    `

const STORAGE_KEY = 'reasoning-graph-train-v1';
let state = {
  currentId: null,

  quizAnswers: {},   // moduleId -> { qIdx -> selectedOptionIdx }
  finalQuizHistory: [] // array of { score, total, duration, ts, breakdown }

// Active final quiz (not persisted, fresh each session)
let currentFinalQuiz = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch (e) { /* storage blocked, ok */ }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* ok */ }
}

function resetState() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  state = { currentId: null, completed: {}, quizAnswers: {}, finalQuizHistory: [] };
  currentFinalQuiz = null;
  saveState();

// ============================================================================
// TEXT TO SPEECH (Web Speech API, free and built in, no key)
// ============================================================================
function ttsSupported() {
  return typeof window !== 'undefined' && 'speechSynthesis' in window;
}

function stopSpeech() {
  if (ttsSupported()) window.speechSynthesis.cancel();
  const btn = document.getElementById('tts-btn');
  if (btn) { btn.classList.remove('speaking'); btn.textContent = '▶ Listen'; }
}

// Pick a natural local voice instead of the default robotic one.
let ttsVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const find = (pred) => voices.find(pred);
  return find(v => v.name === 'Daniel')
    || find(v => v.localService && /en[-_]GB/i.test(v.lang))
    || find(v => v.name === 'Samantha')
    || find(v => v.localService && /^en/i.test(v.lang))
    || find(v => /^en/i.test(v.lang))
    || voices[0];
}
if (ttsSupported()) {
  ttsVoice = pickVoice();
  window.speechSynthesis.onvoiceschanged = () => { ttsVoice = pickVoice(); };
}

// Group sentences into ~220-char chunks; short utterances avoid the
// Chrome bug that silently cuts off long single utterances.
function chunkForSpeech(text) {
  const sentences = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
  const chunks = [];
  let buf = '';
  for (const s of sentences) {
    if ((buf + s).length > 220 && buf) { chunks.push(buf.trim()); buf = ''; }
    buf += s;
  }
  if (buf.trim()) chunks.push(buf.trim());
  return chunks;
}

// Collect readable text from the lesson, skipping code blocks.
function readableLessonText() {
  const root = document.querySelector('.module-content');
  if (!root) return '';
  const parts = [];
  root.querySelectorAll('h3, p, li').forEach(el => {
    if (el.closest('pre, code')) return;
    const clone = el.cloneNode(true);
    clone.querySelectorAll('pre, code').forEach(c => c.remove());
    const text = clone.textContent.replace(/\s+/g, ' ').trim();
    if (text) parts.push(text);
  });
  return parts.join('. ');
}

function bindTts() {
  if (!ttsSupported()) return;
  const btn = document.getElementById('tts-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (window.speechSynthesis.speaking) { stopSpeech(); return; }
    const text = readableLessonText();
    if (!text) return;
    const voice = ttsVoice || pickVoice();
    const chunks = chunkForSpeech(text);
    window.speechSynthesis.cancel();
    chunks.forEach((chunk, i) => {
      const u = new SpeechSynthesisUtterance(chunk);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      u.rate = 1.0;
      u.pitch = 1.0;
      if (i === chunks.length - 1) u.onend = () => stopSpeech();
      u.onerror = () => stopSpeech();
      window.speechSynthesis.speak(u);
    });
    btn.classList.add('speaking');
    btn.textContent = '⏸ Stop';
  });
}

function goTo(id) {
  stopSpeech();
  state.currentId = id;
  saveState();
  if (id === 'final-quiz') {
    renderFinalQuiz();
  } else if (id) {
    renderModule(id);
  } else {
    renderWelcome();
  }
  renderGraph();
  renderList();
  renderProgress();
  document.getElementById('main').scrollTo({ top: 0, behavior: 'instant' });
}
window.goTo = goTo;

function completeModule(id) {
  const m = findModule(id);
  if (!m || !m.quiz) return;
  const answered = state.quizAnswers[id] || {};
  let correct = 0;
  m.quiz.forEach((q, qi) => {
    if (answered[qi] === q.correct) correct++;
  });
  state.completed[id] = { score: correct, total: m.quiz.length, ts: Date.now() };
  saveState();
  renderModule(id);
  renderGraph();
  renderList();
  renderProgress();
}
window.completeModule = completeModule;

function retakeQuiz(id) {
  delete state.completed[id];
  delete state.quizAnswers[id];
  saveState();
  renderModule(id);
  renderGraph();
  renderList();
  renderProgress();
}
window.retakeQuiz = retakeQuiz;

// ============================================================================
// FINAL QUIZ SIMULATOR
// ============================================================================
// Maps module tier to a friendly category name for the breakdown
function categoryFor(tier) {
  if (tier === 1) return 'Tier 1 - Essential';
  if (tier === 2) return 'Tier 2 - Material';
  if (tier === 3) return 'Tier 3 - Round-out';
  if (tier === 'tactics') return 'Practice tactics';
  if (tier === 'project') return 'Project phases';
  return 'Other';
}

// Fisher-Yates shuffle, returns a new array
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build a fresh question pool for the simulator.
// Sources: (1) course module quizzes from tiers 1/2/3 only, (2) SIMULATOR_BANK.
// Tactics and project-phase quizzes are intentionally excluded from the simulator.
function buildQuestionPool() {
  const pool = [];
  COURSE.forEach(m => {
    if (!m.quiz) return;
    if (m.tier !== 1 && m.tier !== 2 && m.tier !== 3) return;
    m.quiz.forEach((q, qi) => {
      pool.push({
        source: m.short,
        tier: m.tier,
        category: categoryFor(m.tier),
        q: q.q,
        options: q.options,
        correct: q.correct,
        explanation: q.explanation
      });
    });
  });
  SIMULATOR_BANK.forEach(q => {
    pool.push({
      source: q.source,
      tier: q.tier,
      category: categoryFor(q.tier),
      q: q.q,
      options: q.options,
      correct: q.correct,
      explanation: q.explanation
    });
  });
  return pool;
}

// Stratified sample with Tier 1 75%, Tier 2 20%, Tier 3 5% weighting.
// 20 questions per run = 15 / 4 / 1.
function sampleFinalQuiz() {
  const pool = buildQuestionPool();
  const t1 = pool.filter(q => q.tier === 1);
  const t2 = pool.filter(q => q.tier === 2);
  const t3 = pool.filter(q => q.tier === 3);
  const picks = [
    ...shuffle(t1).slice(0, Math.min(15, t1.length)),
    ...shuffle(t2).slice(0, Math.min(4, t2.length)),
    ...shuffle(t3).slice(0, Math.min(1, t3.length))
  ];
  // Final shuffle so tiers interleave (no clustering of Vue questions etc.)
  // AND shuffle answer options per question (preserve correct index by remapping)
  return shuffle(picks).map(q => {
    const indexed = q.options.map((opt, i) => ({ opt, original: i }));
    const shuffled = shuffle(indexed);
    return {
      ...q,
      options: shuffled.map(s => s.opt),
      correct: shuffled.findIndex(s => s.original === q.correct)
    };
  });
}

function startNewFinalQuiz() {
  currentFinalQuiz = {
    questions: sampleFinalQuiz(),
    current: 0,
    answers: {},
    startTime: Date.now(),
    submitted: false,
    result: null
  };
  renderFinalQuiz();
}
window.startNewFinalQuiz = startNewFinalQuiz;

function renderFinalQuiz() {
  // No active final quiz: show intro
  if (!currentFinalQuiz) {
    renderFinalQuizIntro();
    return;
  }
  if (currentFinalQuiz.submitted) {
    renderFinalQuizResults();
    return;
  }
  renderFinalQuizQuestion();
}

function renderFinalQuizIntro() {
  const history = state.finalQuizHistory || [];
  const totalQuestionsAvailable = buildQuestionPool().length;
  const bestScore = history.length ? Math.max(...history.map(h => h.score / h.total)) : 0;
  const bestPct = Math.round(bestScore * 100);
  let historyHtml = '';
  if (history.length === 0) {
    historyHtml = '<div class="empty-history">No runs yet. Start your first one above.</div>';
  } else {
    historyHtml = `
      <div class="history-table">
        <div class="history-row head">
          <div>Run</div>
          <div>Score</div>
          <div>Duration</div>
          <div>When</div>
        </div>
        ${history.slice().reverse().slice(0, 10).map((h, i) => {
          const num = history.length - i;
          const pct = Math.round((h.score / h.total) * 100);
          const mins = Math.round(h.duration / 60000);
          const ago = formatAgo(h.ts);
          return `<div class="history-row">
            <div>#${num}</div>
            <div class="score-cell">${h.score}/${h.total} · ${pct}%</div>
            <div>${mins}m</div>
            <div>${ago}</div>
          </div>`;
        }).join('')}
      </div>
    `;
  }
  document.getElementById('content').innerHTML = `
    <div class="final-quiz-intro">
      <div class="module-eyebrow">Capstone</div>
      <h1 class="final-quiz-hero">The <em>final quiz</em></h1>
      <p>Twenty questions sampled across the three knowledge tiers each run. Different mix every time so you cannot memorize a single set. No feedback until the end, so you can see what actually stuck.</p>
      <p>Fifteen from Tier 1, four from Tier 2, one from Tier 3. Answer options are shuffled per question, and the pool combines course quiz questions with a larger dedicated simulator bank.</p>
      <div class="final-quiz-stats">
        <div class="stat-card">
          <div class="stat-card-num">20</div>
          <div class="stat-card-label">Questions</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num">${totalQuestionsAvailable}</div>
          <div class="stat-card-label">In question pool</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num">${history.length}</div>
          <div class="stat-card-label">Runs taken</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num">${history.length ? bestPct + '%' : '—'}</div>
          <div class="stat-card-label">Best score</div>
        </div>
      </div>
      <button class="btn primary" onclick="startNewFinalQuiz()">${history.length ? 'Start a new run' : 'Start final quiz'}</button>
      <h2 class="results-section-title">Past runs</h2>
      ${historyHtml}
    </div>
  `;
  document.getElementById('content').classList.add('fade-in');
  setTimeout(() => document.getElementById('content').classList.remove('fade-in'), 500);
}

function formatAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(ts).toLocaleDateString();
}

function renderFinalQuizQuestion() {
  const iv = currentFinalQuiz;
  const idx = iv.current;
  const q = iv.questions[idx];
  const total = iv.questions.length;
  const selected = iv.answers[idx];
  const answeredCount = Object.keys(iv.answers).length;
  const allAnswered = answeredCount === total;
  const dotsHtml = iv.questions.map((_, i) => {
    const cls = ['iv-dot'];
    if (i === idx) cls.push('current');
    else if (iv.answers[i] !== undefined) cls.push('answered');
    return `<div class="${cls.join(' ')}" data-idx="${i}" title="Question ${i + 1}"></div>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="final-quiz-active">
      <div class="iv-bar"><div class="iv-bar-fill" style="width: ${((idx + 1) / total) * 100}%"></div></div>
      <div class="iv-header">
        <div class="iv-q-counter">Question ${idx + 1} of ${total}</div>
        <div>${answeredCount}/${total} answered</div>
      </div>
      <div class="iv-meta">${q.category}</div>
      <div class="iv-question-text">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, oi) => {
          const cls = 'option' + (selected === oi ? ' selected' : '');
          return `<button class="${cls}" data-opt="${oi}">
            <span class="option-letter">${String.fromCharCode(65 + oi)}</span>
            <span>${opt}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="iv-answered-dots">${dotsHtml}</div>
      <div class="iv-nav">
        <button class="btn" onclick="ivPrev()" ${idx === 0 ? 'disabled' : ''}>← Previous</button>
        <div class="iv-nav-right">
          ${allAnswered ? `<button class="btn primary" onclick="submitFinalQuiz()">Submit quiz</button>` : ''}
          <button class="btn" onclick="ivNext()" ${idx === total - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('content').classList.add('fade-in');
  setTimeout(() => document.getElementById('content').classList.remove('fade-in'), 400);
  // Bind option clicks
  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      const oi = parseInt(btn.dataset.opt);
      currentFinalQuiz.answers[idx] = oi;
      renderFinalQuizQuestion();
    });
  });
  // Bind dot navigation
  document.querySelectorAll('.iv-dot').forEach(d => {
    d.addEventListener('click', () => {
      currentFinalQuiz.current = parseInt(d.dataset.idx);
      renderFinalQuizQuestion();
    });
  });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'instant' });
}

function ivPrev() {
  if (currentFinalQuiz.current > 0) {
    currentFinalQuiz.current--;
    renderFinalQuizQuestion();
  }
}
window.ivPrev = ivPrev;

function ivNext() {
  if (currentFinalQuiz.current < currentFinalQuiz.questions.length - 1) {
    currentFinalQuiz.current++;
    renderFinalQuizQuestion();
  }
}
window.ivNext = ivNext;

function submitFinalQuiz() {
  const iv = currentFinalQuiz;
  const unanswered = iv.questions.filter((_, i) => iv.answers[i] === undefined).length;
  if (unanswered > 0) {
    if (!confirm(`You have ${unanswered} unanswered question${unanswered === 1 ? '' : 's'}. Submit anyway?`)) return;
  }
  let correct = 0;
  const perCategory = {};
  iv.questions.forEach((q, i) => {
    const ans = iv.answers[i];
    const right = ans === q.correct;
    if (right) correct++;
    if (!perCategory[q.category]) perCategory[q.category] = { correct: 0, total: 0 };
    perCategory[q.category].total++;
    if (right) perCategory[q.category].correct++;
  });
  iv.submitted = true;
  iv.result = {
    score: correct,
    total: iv.questions.length,
    duration: Date.now() - iv.startTime,
    perCategory
  };
  // Persist to history
  state.finalQuizHistory = state.finalQuizHistory || [];
  state.finalQuizHistory.push({
    score: correct,
    total: iv.questions.length,
    duration: iv.result.duration,
    ts: Date.now(),
    breakdown: perCategory
  });
  saveState();
  renderFinalQuizResults();
  renderGraph();
  renderList();
}
window.submitFinalQuiz = submitFinalQuiz;

function renderFinalQuizResults() {
  const iv = currentFinalQuiz;
  const r = iv.result;
  const pct = Math.round((r.score / r.total) * 100);
  let scoreClass = 'mid';
  let verdict = '';
  if (pct >= 80) { scoreClass = 'pass'; verdict = 'Strong. These concepts are solid enough to explain cold.'; }
  else if (pct >= 65) { scoreClass = 'mid'; verdict = 'Solid. Tighten the misses below and you are there.'; }
  else if (pct >= 50) { scoreClass = 'mid'; verdict = 'Getting there. Review the topics in red and retake.'; }
  else { scoreClass = 'fail'; verdict = 'Not ready yet. Go back to the weak topics, then retake.'; }
  const mins = Math.floor(r.duration / 60000);
  const secs = Math.floor((r.duration % 60000) / 1000);
  // Category breakdown sorted by performance
  const categories = Object.entries(r.perCategory).sort((a, b) => {
    return (b[1].correct / b[1].total) - (a[1].correct / a[1].total);
  });
  const breakdownHtml = categories.map(([cat, stats]) => {
    const catPct = (stats.correct / stats.total) * 100;
    let barClass = '';
    if (catPct >= 80) barClass = 'high';
    else if (catPct < 50) barClass = 'low';
    return `
      <div class="breakdown-row">
        <div class="breakdown-label">${cat}</div>
        <div class="breakdown-bar"><div class="breakdown-bar-fill ${barClass}" style="width: ${catPct}%"></div></div>
        <div class="breakdown-score">${stats.correct}/${stats.total}</div>
      </div>
    `;
  }).join('');
  // Question-by-question review
  const reviewHtml = iv.questions.map((q, i) => {
    const ans = iv.answers[i];
    const right = ans === q.correct;
    const answeredLabel = ans === undefined ? '<span class="wrong">Not answered</span>' : (right
      ? `<span class="right">You: ${String.fromCharCode(65 + ans)}. ${q.options[ans]}</span>`
      : `<span class="wrong">You: ${String.fromCharCode(65 + ans)}. ${q.options[ans]}</span> &nbsp; <span class="right">Correct: ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</span>`);
    return `
      <div class="missed-q ${right ? 'passed' : ''}">
        <div class="missed-q-source">${q.category} · ${q.source}</div>
        <div class="missed-q-text">${q.q}</div>
        <div class="missed-q-detail">${answeredLabel}</div>
        <div class="missed-q-detail" style="margin-top: 10px;">${q.explanation}</div>
      </div>
    `;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="iv-results">
      <div class="module-eyebrow">Quiz complete</div>
      <div class="results-hero">
        <div class="results-score ${scoreClass}">${r.score}/${r.total}</div>
        <div class="results-label">${pct}% · ${mins}m ${secs}s</div>
        <div class="results-verdict">${verdict}</div>
      </div>
      <h2 class="results-section-title">Breakdown by category</h2>
      ${breakdownHtml}
      <h2 class="results-section-title">Every question</h2>
      ${reviewHtml}
      <div class="iv-nav" style="margin-top: 48px;">
        <button class="btn primary" onclick="startNewFinalQuiz()">New run (different questions)</button>
        <button class="btn" onclick="exitFinalQuiz()">Back to course</button>
      </div>
    </div>
  `;
  document.getElementById('content').classList.add('fade-in');
  setTimeout(() => document.getElementById('content').classList.remove('fade-in'), 500);
  document.getElementById('main').scrollTo({ top: 0, behavior: 'instant' });
}

function exitFinalQuiz() {
  currentFinalQuiz = null;
  goTo(null);
}
window.exitFinalQuiz = exitFinalQuiz;

// ============================================================================
// INIT
// ============================================================================
function init() {
  loadState();
  renderList();
  renderGraph();
  renderProgress();
  if (state.currentId === 'final-quiz') {
    renderFinalQuiz();
  } else if (state.currentId && findModule(state.currentId)) {
    renderModule(state.currentId);
  } else {
    renderWelcome();
  }
  document.getElementById('reset-btn').addEventListener('click', resetState);
  document.getElementById('mobile-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
}

init();
</script>
</body>
</html>
